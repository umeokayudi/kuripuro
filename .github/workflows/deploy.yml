name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_G3qVUPQ27CLe8cPtxEBsrkxw
  VERCEL_PROJECT_ID: prj_CwcXzleb2pOrKitSu6DFh7CRsvJU

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Project IDs hardcoded in ci-deploy.sh — do not pass VERCEL_PROJECT_ID from secrets
        run: bash scripts/ci-deploy.sh

      - name: Verify production
        run: |
          sleep 20
          for i in 1 2 3 4 5 6 8 10; do
            BODY=$(curl -sf "https://kuripuro.vercel.app/api/version" || true)
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q '"ok":true'; then
              BUNDLE=$(curl -sf "https://kuripuro.vercel.app/" | rg -o 'index-[^"]+\.js' | head -1 || true)
              if [ -n "$BUNDLE" ]; then
                if curl -sf "https://kuripuro.vercel.app/assets/$BUNDLE" | grep -q 'client:{portal:'; then
                  echo "✅ Client portal i18n fix live"
                else
                  echo "::warning::Production bundle missing tr.client — redeploy may be stale"
                fi
              fi
              echo "$BODY" | grep -q 'v17' && echo "✅ v17 live" || echo "✅ API responding: $BODY"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::warning::Could not verify /api/version after deploy"
