name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_G3qVUPQ27CLe8cPtxEBsrkxw
  VERCEL_PROJECT_ID: prj_CwcXzleb2pOrKitSu6DFh7CRsvJU

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:deep-clean

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Project IDs hardcoded in ci-deploy.sh — do not pass VERCEL_PROJECT_ID from secrets
        run: bash scripts/ci-deploy.sh

      - name: Verify production
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            BODY=$(curl -sf "https://kuripuro.vercel.app/api/version" || true)
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q '"ok":true'; then
              echo "$BODY" | grep -q '2026-08-28-v' && echo "✅ v15+ live" && exit 0
              echo "✅ API responding: $BODY"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Could not verify /api/version after deploy"
